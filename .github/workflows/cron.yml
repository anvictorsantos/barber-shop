name: Cron

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Job to run
        type: choice
        default: all
        options:
          - all
          - reminders
          - expire-holds
          - expire-credits
          - push-alerts

concurrency:
  group: cron-${{ github.event.schedule || inputs.target }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Call due endpoints
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          call() {
            echo "POST /api/cron/$1"
            curl -fsS -X POST "$APP_URL/api/cron/$1" \
              -H "Authorization: Bearer $CRON_SECRET"
            echo
          }

          if [ -n "${TARGET:-}" ]; then
            case "$TARGET" in
              all)
                call reminders
                call expire-holds
                call expire-credits
                call push-alerts
                ;;
              *)
                call "$TARGET"
                ;;
            esac
          elif [ "$SCHEDULE" = '*/5 * * * *' ]; then
            call expire-holds
            call push-alerts
          else
            call reminders
            call expire-credits
          fi
